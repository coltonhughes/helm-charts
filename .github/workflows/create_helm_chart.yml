name: Release Helm Charts

on:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

concurrency:
  group: release-helm-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-consumer-charts:
    runs-on: helm-chart-builder
    outputs:
      charts: ${{ steps.discover.outputs.charts }}
      common_changed: ${{ steps.discover.outputs.common_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover consumer charts
        id: discover
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          changed_files=()
          common_changed=false

          mapfile -t charts < <(
            find charts -mindepth 2 -maxdepth 2 -name Chart.yaml -print \
              | sort \
              | while read -r chart_yaml; do
                  chart_dir="$(dirname "$chart_yaml")"
                  chart_name="$(basename "$chart_dir")"
                  [ "$chart_name" = "common" ] && continue
                  grep -q 'name: common' "$chart_yaml" || continue
                  printf '%s\n' "$chart_name"
                done
          )

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "${PUSH_BEFORE:-}" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            common_changed=true
            changed_charts=("${charts[@]}")
          else
            mapfile -t changed_files < <(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA")
            for changed_file in "${changed_files[@]}"; do
              case "$changed_file" in
                charts/common/*) common_changed=true ;;
              esac
            done

            changed_charts=()
            if [ "$common_changed" = true ]; then
              changed_charts=("${charts[@]}")
            else
              for chart_name in "${charts[@]}"; do
                for changed_file in "${changed_files[@]}"; do
                  case "$changed_file" in
                    "charts/$chart_name"/*) changed_charts+=("$chart_name"); break ;;
                  esac
                done
              done
            fi
          fi

          # A failed run must not strand a chart version indefinitely. Reconcile
          # the chart versions in the checkout with the release tags, selecting
          # every chart whose current version has not been published yet.
          common_version="$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' charts/common/Chart.yaml)"
          if ! git rev-parse --verify --quiet "refs/tags/common-$common_version" >/dev/null; then
            common_changed=true
          fi

          declare -A selected_charts=()
          for chart_name in "${changed_charts[@]}"; do
            selected_charts["$chart_name"]=1
          done

          for chart_name in "${charts[@]}"; do
            chart_version="$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' "charts/$chart_name/Chart.yaml")"
            if ! git rev-parse --verify --quiet "refs/tags/$chart_name-$chart_version" >/dev/null; then
              selected_charts["$chart_name"]=1
            fi
          done

          changed_charts=()
          if [ "${#selected_charts[@]}" -gt 0 ]; then
            mapfile -t changed_charts < <(printf '%s\n' "${!selected_charts[@]}" | sort)
          fi

          charts_json="["
          for chart_name in "${changed_charts[@]}"; do
            if [ "$charts_json" != "[" ]; then
              charts_json+=","
            fi
            charts_json+="\"$chart_name\""
          done
          charts_json+="]"

          echo "charts=$charts_json" >> "$GITHUB_OUTPUT"
          echo "common_changed=$common_changed" >> "$GITHUB_OUTPUT"
          echo "Selected charts: $charts_json"

  validate-common:
    runs-on: helm-chart-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate common chart
        run: |
          helm lint charts/common

  validate-consumer-charts:
    if: needs.discover-consumer-charts.outputs.charts != '[]'
    runs-on: helm-chart-builder
    needs:
      - discover-consumer-charts
      - validate-common
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover-consumer-charts.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run consumer chart render regression
        run: ./tests/test-consumer-charts.sh "${{ matrix.chart }}"

  release-common:
    if: needs.discover-consumer-charts.outputs.common_changed == 'true'
    runs-on: helm-chart-builder
    needs:
      - discover-consumer-charts
      - validate-common
      - validate-consumer-charts
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          install_only: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Publish common chart
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"

          mkdir -p .cr-release-packages
          cr package charts/common --package-path .cr-release-packages
          cr upload --owner "$owner" --git-repo "$repo" --package-path .cr-release-packages --skip-existing
          mkdir -p .cr-index
          cr index --owner "$owner" --git-repo "$repo" --package-path .cr-release-packages --pages-branch gh-pages --push

  release-consumer-charts:
    if: >-
      always() &&
      (needs.release-common.result == 'success' || needs.release-common.result == 'skipped') &&
      needs.validate-common.result == 'success' &&
      needs.validate-consumer-charts.result == 'success' &&
      needs.discover-consumer-charts.outputs.charts != '[]'
    runs-on: helm-chart-builder
    needs:
      - discover-consumer-charts
      - release-common
      - validate-common
      - validate-consumer-charts
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          install_only: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure Helm repo cache
        env:
          CHARTS_JSON: ${{ needs.discover-consumer-charts.outputs.charts }}
        run: |
          helm repo add helm-charts https://coltonhughes.github.io/helm-charts
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

          update_chart_deps() {
            local chart_dir="$1"
            local max_attempts=6
            local attempt=1

            while ! helm dependency update "$chart_dir"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "helm dependency update failed for $chart_dir after $max_attempts attempts" >&2
                return 1
              fi
              attempt=$((attempt + 1))
              echo "Retrying dependency update for $chart_dir in 10s (attempt $attempt/$max_attempts)..."
              sleep 10
              helm repo update
            done
          }

          mapfile -t changed_charts < <(jq -r '.[]' <<< "$CHARTS_JSON")
          for chart_name in "${changed_charts[@]}"; do
            update_chart_deps "charts/$chart_name"
          done

      - name: Publish remaining charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CHARTS_JSON: ${{ needs.discover-consumer-charts.outputs.charts }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"

          mkdir -p .cr-release-packages
          mapfile -t changed_charts < <(jq -r '.[]' <<< "$CHARTS_JSON")
          for chart_name in "${changed_charts[@]}"; do
            cr package "charts/$chart_name" --package-path .cr-release-packages
          done
          cr upload --owner "$owner" --git-repo "$repo" --package-path .cr-release-packages --skip-existing
          mkdir -p .cr-index
          cr index --owner "$owner" --git-repo "$repo" --package-path .cr-release-packages --pages-branch gh-pages --push

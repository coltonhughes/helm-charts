{{- $databaseSecret := default dict .Values.database.secret -}}
{{- $databaseSecretEnabled := default false $databaseSecret.enabled -}}
{{- $databaseSecretCreate := default false $databaseSecret.create -}}
{{- $cnpgEnabled := default false .Values.database.cnpg.enabled -}}
{{- if and $databaseSecretEnabled $databaseSecretCreate -}}
{{- $databaseURL := trim (default "" .Values.database.url) -}}
{{- $databaseScheme := default "postgresql+asyncpg" .Values.database.scheme -}}
{{- if $cnpgEnabled -}}
{{- $cnpgNamespace := default .Release.Namespace .Values.database.cnpg.namespace -}}
{{- $cnpgClusterName := default (printf "%s-cnpg" (include "common.fullname" .)) .Values.database.cnpg.clusterName -}}
{{- $cnpgDatabase := .Values.database.cnpg.credentials.database | default "bambuddy" -}}
{{- $cnpgUser := .Values.database.cnpg.credentials.username | default "bambuddy" -}}
{{- $cnpgPassword := .Values.database.cnpg.credentials.password | default "bambuddy" -}}
{{- $existingCredentialsSecret := default dict .Values.database.cnpg.existingCredentialsSecret -}}
{{- if default false $existingCredentialsSecret.enabled -}}
  {{- $existingCredentialsSecretName := default "" $existingCredentialsSecret.name -}}
  {{- if eq $existingCredentialsSecretName "" -}}
{{ fail "database.cnpg.existingCredentialsSecret.name is required when existingCredentialsSecret.enabled is true" }}
  {{- end -}}
  {{- $usernameKey := default "username" $existingCredentialsSecret.usernameKey -}}
  {{- $passwordKey := default "password" $existingCredentialsSecret.passwordKey -}}
  {{- $databaseKey := default "dbname" $existingCredentialsSecret.databaseKey -}}
  {{- $existingSecret := lookup "v1" "Secret" $cnpgNamespace $existingCredentialsSecretName -}}
  {{- if not $existingSecret -}}
{{ fail (printf "database.cnpg.existingCredentialsSecret %q was not found in namespace %q" $existingCredentialsSecretName $cnpgNamespace) }}
  {{- end -}}
  {{- $secretData := default dict $existingSecret.data -}}
  {{- $encodedUser := get $secretData $usernameKey -}}
  {{- $encodedPassword := get $secretData $passwordKey -}}
  {{- $encodedDatabase := get $secretData $databaseKey -}}
  {{- if or (eq (default "" $encodedUser) "") (eq (default "" $encodedPassword) "") -}}
{{ fail (printf "database.cnpg.existingCredentialsSecret %q must contain %q and %q" $existingCredentialsSecretName $usernameKey $passwordKey) }}
  {{- end -}}
  {{- $cnpgUser = b64dec $encodedUser -}}
  {{- $cnpgPassword = b64dec $encodedPassword -}}
  {{- if ne (default "" $encodedDatabase) "" -}}
    {{- $cnpgDatabase = b64dec $encodedDatabase -}}
  {{- end -}}
{{- end -}}
{{- $databaseHost := printf "%s-rw.%s.svc.%s" $cnpgClusterName $cnpgNamespace .Values.database.cnpg.clusterDomain -}}
{{- $databaseURL = printf "%s://%s:%s@%s:%d/%s" $databaseScheme (urlquery $cnpgUser) (urlquery $cnpgPassword) $databaseHost 5432 $cnpgDatabase -}}
{{- end -}}
{{- if eq $databaseURL "" -}}
{{ fail "database.secret.create requires either database.url or database.cnpg.enabled" }}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $databaseSecret.name | default (printf "%s-database" (include "common.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $databaseSecret.key | default "DATABASE_URL" }}: {{ $databaseURL | quote }}
{{- end }}

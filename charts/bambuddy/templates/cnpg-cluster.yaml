{{- if .Values.database.cnpg.enabled }}
{{- $fullname := include "common.fullname" . -}}
{{- $namespace := default .Release.Namespace .Values.database.cnpg.namespace -}}
{{- $clusterName := default (printf "%s-cnpg" $fullname) .Values.database.cnpg.clusterName -}}
{{- $username := .Values.database.cnpg.credentials.username | default "bambuddy" -}}
{{- $password := .Values.database.cnpg.credentials.password | default "bambuddy" -}}
{{- $database := .Values.database.cnpg.credentials.database | default "bambuddy" -}}
{{- $credentialsSecretName := .Values.database.cnpg.credentials.secretName -}}
{{- if and .Values.database.cnpg.createCredentialsSecret (eq $credentialsSecretName "") -}}
{{- $credentialsSecretName = printf "%s-cnpg-credentials" $clusterName -}}
{{- end -}}

{{- if and (not .Values.database.cnpg.createCredentialsSecret) (eq $credentialsSecretName "") }}
{{ fail "database.cnpg.credentials.secretName is required when database.cnpg.createCredentialsSecret is false" }}
{{- end -}}

{{- if .Values.database.cnpg.createCredentialsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credentialsSecretName }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $username | quote }}
  password: {{ $password | quote }}
  dbname: {{ $database | quote }}
---
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $clusterName }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  instances: {{ .Values.database.cnpg.instances | default 1 }}
  {{- with .Values.database.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  storage:
    size: {{ .Values.database.cnpg.storage.size | quote }}
    {{- with .Values.database.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ $database | quote }}
      owner: {{ $username | quote }}
      secret:
        name: {{ $credentialsSecretName | quote }}
  {{- with .Values.database.cnpg.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.database.cnpg.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.database.cnpg.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.database.cnpg.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.database.cnpg.backup.retentionPolicy | quote }}
  {{- end }}
{{- end }}

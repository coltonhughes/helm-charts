{{- $secretName := include "mini-hf.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := default dict $existing.data -}}
{{- $jwt := .Values.security.jwtSecretKey -}}
{{- if eq $jwt "" -}}
  {{- $jwt = default (randAlphaNum 64) (get $existingData "JWT_SECRET_KEY" | default "" | b64dec) -}}
{{- end -}}
{{- $adminPassword := .Values.admin.password -}}
{{- if eq $adminPassword "" -}}
  {{- $adminPassword = default (randAlphaNum 32) (get $existingData "DEFAULT_ADMIN_PASSWORD" | default "" | b64dec) -}}
{{- end -}}
{{- $configEncryptionKey := .Values.security.configEncryptionKey -}}
{{- if eq $configEncryptionKey "" -}}
  {{- $configEncryptionKey = $jwt -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ $jwt | quote }}
  DEFAULT_ADMIN_PASSWORD: {{ $adminPassword | quote }}
  CONFIG_ENCRYPTION_KEY: {{ $configEncryptionKey | quote }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | quote }}
---
{{ if .Values.database.cnpg.enabled -}}
{{- $dbSecretName := include "mini-hf.databaseSecretName" . -}}
{{- $dbNamespace := default .Release.Namespace .Values.database.cnpg.namespace -}}
{{- $existingDB := lookup "v1" "Secret" $dbNamespace $dbSecretName -}}
{{- $existingDBData := default dict $existingDB.data -}}
{{- $dbPassword := .Values.database.cnpg.credentials.password -}}
{{- if eq $dbPassword "" -}}
  {{- $dbPassword = default (randAlphaNum 40) (get $existingDBData "password" | default "" | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbSecretName }}
  namespace: {{ $dbNamespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.database.cnpg.credentials.username | quote }}
  password: {{ $dbPassword | quote }}
  dbname: {{ .Values.database.cnpg.credentials.database | quote }}
{{- end }}

{{- if .Values.database.cnpg.enabled -}}
{{- $dbSecret := include "mini-hf.databaseSecretName" . -}}
{{- $dbHost := include "mini-hf.databaseHost" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mini-hf.fullname" . }}-migrate
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    # On install, run after CNPG resources have been created; on upgrades,
    # migrate before regular release resources are updated.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 15
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command: ["uv", "run", "alembic", "upgrade", "head"]
          env:
            - name: PG_HOST
              value: {{ $dbHost | quote }}
            - name: PG_PORT
              value: "5432"
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: dbname
{{- end }}

{{- $root := . -}}
{{- $appSecret := include "mini-hf.secretName" . -}}
{{- $dbEnabled := .Values.database.cnpg.enabled -}}
{{- $dbSecret := include "mini-hf.databaseSecretName" . -}}
{{- $dbHost := include "mini-hf.databaseHost" . -}}
{{- $valkeyHost := include "mini-hf.valkeyHost" . -}}
{{- $redisURL := .Values.redis.url -}}
{{- if eq $redisURL "" -}}{{- $redisURL = printf "redis://%s" $valkeyHost -}}{{- end -}}
{{- $backendImage := dict "repository" .Values.image.backend.repository "tag" (.Values.image.backend.tag | default .Chart.AppVersion) "pullPolicy" .Values.image.backend.pullPolicy -}}
{{- $frontendImage := dict "repository" .Values.image.frontend.repository "tag" (.Values.image.frontend.tag | default .Chart.AppVersion) "pullPolicy" .Values.image.frontend.pullPolicy -}}
{{- $appSecretChecksum := toYaml (dict "jwt" .Values.security.jwtSecretKey "admin" .Values.admin.password "encryption" .Values.security.configEncryptionKey "s3Access" .Values.s3.accessKey "s3Secret" .Values.s3.secretKey) | sha256sum -}}
{{- $dbSecretChecksum := toYaml .Values.database.cnpg.credentials | sha256sum -}}
{{- $backendSecretEnv := list
  (dict "name" "JWT_SECRET_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" $appSecret "key" "JWT_SECRET_KEY")))
  (dict "name" "DEFAULT_ADMIN_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" $appSecret "key" "DEFAULT_ADMIN_PASSWORD")))
  (dict "name" "CONFIG_ENCRYPTION_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" $appSecret "key" "CONFIG_ENCRYPTION_KEY")))
  (dict "name" "S3_ACCESS_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" $appSecret "key" "S3_ACCESS_KEY")))
  (dict "name" "S3_SECRET_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" $appSecret "key" "S3_SECRET_KEY")))
-}}
{{- $databaseEnv := list -}}
{{- if $dbEnabled -}}
  {{- $databaseEnv = append $databaseEnv (dict "name" "PG_HOST" "value" $dbHost) -}}
  {{- $databaseEnv = append $databaseEnv (dict "name" "PG_PORT" "value" "5432") -}}
  {{- $databaseEnv = append $databaseEnv (dict "name" "PG_USERNAME" "valueFrom" (dict "secretKeyRef" (dict "name" $dbSecret "key" "username"))) -}}
  {{- $databaseEnv = append $databaseEnv (dict "name" "PG_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" $dbSecret "key" "password"))) -}}
  {{- $databaseEnv = append $databaseEnv (dict "name" "PG_DATABASE" "valueFrom" (dict "secretKeyRef" (dict "name" $dbSecret "key" "dbname"))) -}}
{{- end -}}
{{- $backendEnv := concat $backendSecretEnv $databaseEnv (list
  (dict "name" "TZ" "value" .Values.timezone)
  (dict "name" "REDIS_URL" "value" $redisURL)
  (dict "name" "HF_SERVER_URL" "value" .Values.publicURLs.hf)
  (dict "name" "MS_SERVER_URL" "value" .Values.publicURLs.modelscope)
  (dict "name" "DEFAULT_ADMIN_EMAIL" "value" .Values.admin.email)
  (dict "name" "JWT_ACCESS_TOKEN_EXPIRE_MINUTES" "value" (printf "%v" .Values.security.accessTokenExpireMinutes))
  (dict "name" "S3_ENDPOINT" "value" .Values.s3.endpoint)
  (dict "name" "S3_BUCKET_NAME" "value" .Values.s3.bucket)
  (dict "name" "S3_REGION" "value" .Values.s3.region)
  (dict "name" "S3_USE_SSL" "value" (printf "%v" .Values.s3.useSSL))
  (dict "name" "S3_VERIFY_SSL" "value" (printf "%v" .Values.s3.verifySSL))
  (dict "name" "S3_PRESIGNED_URL_EXPIRATION" "value" (printf "%v" .Values.s3.presignedURLExpiration))
) -}}
{{- $frontendEnv := list
  (dict "name" "API_BASE_URL" "value" .Values.publicURLs.management)
  (dict "name" "HF_SERVER_URL" "value" .Values.publicURLs.hf)
  (dict "name" "MS_SERVER_URL" "value" .Values.publicURLs.modelscope)
  (dict "name" "EMAIL_DOMAIN" "value" .Values.frontend.emailDomain)
-}}
{{- $components := list
  (dict "name" "ui" "image" $frontendImage "replicas" .Values.frontend.replicaCount "port" 80 "args" list "env" $frontendEnv "resources" .Values.frontend.resources "route" .Values.routes.ui "readinessPath" "/" "livenessPath" "/")
  (dict "name" "management" "image" $backendImage "replicas" .Values.mgmtServer.replicaCount "port" 9800 "command" (list "python" "-m" "mgmt_server.main") "env" $backendEnv "resources" .Values.mgmtServer.resources "route" .Values.routes.management "readinessPath" "/api/v1/health/" "livenessPath" "/api/v1/health/")
  (dict "name" "hf" "image" $backendImage "replicas" .Values.hfServer.replicaCount "port" 9801 "command" (list "python" "-m" "hf_server.main") "env" $backendEnv "resources" .Values.hfServer.resources "route" .Values.routes.hf "readinessPath" "/" "livenessPath" "/")
  (dict "name" "modelscope" "image" $backendImage "replicas" .Values.msServer.replicaCount "port" 9802 "command" (list "python" "-m" "ms_server.main") "env" $backendEnv "resources" .Values.msServer.resources "route" .Values.routes.modelscope "readinessPath" "/" "livenessPath" "/")
  (dict "name" "worker" "image" $backendImage "replicas" .Values.workers.general.replicaCount "port" 9800 "command" (list "python" "-m" "worker.main") "env" $backendEnv "resources" .Values.workers.general.resources "scratch" .Values.workers.general.scratch "incompletePath" "/tmp/mini-hf")
  (dict "name" "worker-small" "image" $backendImage "replicas" .Values.workers.small.replicaCount "port" 9800 "command" (list "python" "-m" "worker.main") "env" (append $backendEnv (dict "name" "WORKER_MAX_REPO_STORAGE_GB" "value" (printf "%v" .Values.workers.small.maxRepoStorageGB))) "resources" .Values.workers.small.resources "scratch" .Values.workers.small.scratch "incompletePath" "/tmp/mini-hf")
-}}
{{- $_ := set (index $components 1) "scratch" .Values.mgmtServer.scratch -}}
{{- $_ := set (index $components 1) "incompletePath" .Values.mgmtServer.incompleteFilePath -}}
{{- $_ := set (index $components 2) "incompletePath" .Values.mgmtServer.incompleteFilePath -}}
{{- $_ := set (index $components 3) "incompletePath" .Values.mgmtServer.incompleteFilePath -}}
{{- $_ := set (index $components 4) "incompletePath" "/tmp/mini-hf" -}}
{{- $_ := set (index $components 5) "incompletePath" "/tmp/mini-hf" -}}
{{- range $component := $components -}}
  {{- $container := dict "env" dict "envList" $component.env "command" (default list $component.command) "args" (default list $component.args) -}}
  {{- if $component.incompletePath -}}
    {{- $_ := set $container "envList" (append $container.envList (dict "name" "INCOMPLETE_FILE_PATH" "value" $component.incompletePath)) -}}
  {{- end -}}
  {{- $service := dict "type" "ClusterIP" "port" $component.port "targetPort" "http" -}}
  {{- $readinessProbe := dict -}}
  {{- $livenessProbe := dict -}}
  {{- if $component.readinessPath -}}
    {{- $readinessProbe = dict "httpGet" (dict "path" $component.readinessPath "port" "http") "initialDelaySeconds" 10 "periodSeconds" 15 "timeoutSeconds" 5 -}}
    {{- $livenessProbe = dict "httpGet" (dict "path" $component.livenessPath "port" "http") "initialDelaySeconds" 20 "periodSeconds" 30 "timeoutSeconds" 5 -}}
  {{- end -}}
  {{- $volumes := list -}}
  {{- $volumeMounts := list -}}
  {{- if $component.scratch -}}
    {{- $scratch := $component.scratch -}}
    {{- $volume := dict "name" "scratch" -}}
    {{- if $scratch.existingClaim -}}
      {{- $_ := set $volume "persistentVolumeClaim" (dict "claimName" $scratch.existingClaim) -}}
    {{- else -}}
      {{- $emptyDir := dict -}}
      {{- if $scratch.sizeLimit -}}{{- $_ := set $emptyDir "sizeLimit" $scratch.sizeLimit -}}{{- end -}}
      {{- $_ := set $volume "emptyDir" $emptyDir -}}
    {{- end -}}
    {{- $volumes = append $volumes $volume -}}
    {{- $incompletePath := default "/tmp/mini-hf" $component.incompletePath -}}
    {{- $volumeMounts = append $volumeMounts (dict "name" "scratch" "mountPath" $incompletePath) -}}
  {{- end -}}
  {{- $routeConfig := default dict $component.route -}}
  {{- $route := dict "enabled" false -}}
  {{- if $routeConfig.enabled -}}
    {{- if not $routeConfig.hostnames -}}
      {{- fail (printf "routes.%s.hostnames must contain at least one hostname when the route is enabled" $component.name) -}}
    {{- end -}}
    {{- $route = dict "enabled" true "parentRefs" $routeConfig.parentRefs "hostnames" $routeConfig.hostnames "annotations" $routeConfig.annotations "labels" $routeConfig.labels -}}
  {{- end -}}
  {{- $podAnnotations := dict -}}
  {{- if not (eq $component.name "ui") -}}
    {{- $_ := set $podAnnotations "checksum/mini-hf-secrets" $appSecretChecksum -}}
    {{- $_ := set $podAnnotations "checksum/database-credentials" $dbSecretChecksum -}}
  {{- end -}}
  {{- $ctx := include "mini-hf.componentContext" (dict "root" $root "component" $component.name "image" $component.image "container" $container "service" $service "replicas" $component.replicas "resources" $component.resources "podAnnotations" $podAnnotations "route" $route "readinessProbe" $readinessProbe "livenessProbe" $livenessProbe "volumes" $volumes "volumeMounts" $volumeMounts) | fromYaml -}}
---
{{ include "common.deployment" $ctx }}
{{ if not (hasPrefix "worker" $component.name) }}
---
{{ include "common.service" $ctx }}
  {{ if $routeConfig.enabled }}
{{ include "common.gatewayapi" $ctx }}
  {{ end }}
{{ end }}
{{- end }}

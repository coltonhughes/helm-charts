{{- $mode := .Values.tracearr.mode | default "standard" -}}
{{- if not (or (eq $mode "standard") (eq $mode "supervised")) -}}
{{ fail (printf "tracearr.mode must be either 'standard' or 'supervised', got %q" $mode) }}
{{- end -}}

{{- $modeValues := default (dict) (get .Values.tracearr.modes $mode) -}}
{{- $modeImage := default (dict) $modeValues.image -}}
{{- $imageRepository := default .Values.image.repository $modeImage.repository -}}
{{- $imagePullPolicy := default .Values.image.pullPolicy $modeImage.pullPolicy -}}
{{- $imageTag := default .Values.image.tag $modeImage.tag -}}

{{- if and (eq $mode "supervised") (ne $imageTag "supervised") -}}
{{ fail "supervised mode requires tracearr image tag to be 'supervised'" }}
{{- end -}}

{{- $legacyPostgresqlEnabled := .Values.tracearr.stateful.postgresql.enabled -}}
{{- $cnpgEnabled := default false .Values.tracearr.stateful.cnpg.enabled -}}
{{- $legacyValkeyEnabled := default false .Values.tracearr.stateful.valkey.enabled -}}
{{- $legacyRedisAliasEnabled := default false .Values.tracearr.stateful.redis.enabled -}}
{{- $valkeyDependencyEnabled := and (default false .Values.tracearr.stateful.valkey.useDependency) (default false .Values.valkey.enabled) -}}

{{- if and (eq $mode "supervised") (or $legacyPostgresqlEnabled $cnpgEnabled (or $legacyValkeyEnabled $legacyRedisAliasEnabled) $valkeyDependencyEnabled) -}}
{{ fail "stateful dependencies are only supported for standard mode" }}
{{- end -}}

{{- if and $legacyValkeyEnabled $legacyRedisAliasEnabled -}}
{{ fail "cannot enable both tracearr.stateful.valkey.enabled and tracearr.stateful.redis.enabled" }}
{{- end -}}

{{- if and (default false .Values.tracearr.stateful.valkey.useDependency) (not $valkeyDependencyEnabled) -}}
{{ fail "tracearr.stateful.valkey.useDependency requires valkey.enabled=true for the dependency chart" }}
{{- end -}}

{{- if and (default false .Values.tracearr.stateful.valkey.useDependency) (or $legacyValkeyEnabled $legacyRedisAliasEnabled) -}}
{{ fail "tracearr.stateful.valkey.useDependency cannot be used with legacy valkey/redis stateful helper settings" }}
{{- end -}}

{{- $tracearrEnv := dict -}}
{{- range $key, $value := .Values.container.env }}
{{- $_ := set $tracearrEnv $key $value }}
{{- end -}}
{{- range $key, $value := .Values.tracearr.container.env }}
{{- $_ := set $tracearrEnv $key $value }}
{{- end -}}

{{- if not (hasKey $tracearrEnv "PORT") -}}
{{- $_ := set $tracearrEnv "PORT" (printf "%v" (int .Values.service.port)) -}}
{{- end -}}

{{- if hasKey .Values.tracearr "claimCode" -}}
{{- if ne (default "" .Values.tracearr.claimCode) "" -}}
{{- $_ := set $tracearrEnv "CLAIM_CODE" .Values.tracearr.claimCode -}}
{{- end -}}
{{- end -}}

{{- if hasKey .Values.tracearr "sessionSecret" -}}
{{- if ne (default "" .Values.tracearr.sessionSecret) "" -}}
{{- $_ := set $tracearrEnv "SESSION_SECRET" .Values.tracearr.sessionSecret -}}
{{- end -}}
{{- end -}}

{{- if eq $mode "standard" -}}
  {{- $databaseURL := trim (default "" .Values.tracearr.database.url) -}}
  {{- $redisURL := trim (default "" .Values.tracearr.redis.url) -}}
  {{- $defaultDatabaseURL := "postgres://tracearr:tracearr@postgres:5432/tracearr" -}}
  {{- $defaultRedisURL := "redis://redis:6379/0" -}}

  {{- $hasExternalDatabaseURL := and (ne $databaseURL "") (ne $databaseURL $defaultDatabaseURL) -}}
  {{- $hasExternalRedisURL := and (ne $redisURL "") (ne $redisURL $defaultRedisURL) -}}

  {{- $databaseSourceCount := 0 -}}
  {{- if $hasExternalDatabaseURL -}}
    {{- $databaseSourceCount = add $databaseSourceCount 1 -}}
  {{- end -}}
  {{- if $legacyPostgresqlEnabled -}}
    {{- $databaseSourceCount = add $databaseSourceCount 1 -}}
  {{- end -}}
  {{- if $cnpgEnabled -}}
    {{- $databaseSourceCount = add $databaseSourceCount 1 -}}
  {{- end -}}

  {{- if gt $databaseSourceCount 1 -}}
{{ fail "standard mode supports only one database source: tracearr.database.url, tracearr.stateful.postgresql.enabled, or tracearr.stateful.cnpg.enabled" }}
  {{- end -}}
  {{- if eq $databaseSourceCount 0 -}}
{{ fail "standard mode requires tracearr.database.url, tracearr.stateful.postgresql.enabled, or tracearr.stateful.cnpg.enabled" }}
  {{- end -}}

  {{- $valkeySourceCount := 0 -}}
  {{- if $hasExternalRedisURL -}}
    {{- $valkeySourceCount = add $valkeySourceCount 1 -}}
  {{- end -}}
  {{- if $legacyValkeyEnabled -}}
    {{- $valkeySourceCount = add $valkeySourceCount 1 -}}
  {{- end -}}
  {{- if $legacyRedisAliasEnabled -}}
    {{- $valkeySourceCount = add $valkeySourceCount 1 -}}
  {{- end -}}
  {{- if $valkeyDependencyEnabled -}}
    {{- $valkeySourceCount = add $valkeySourceCount 1 -}}
  {{- end -}}

  {{- if gt $valkeySourceCount 1 -}}
{{ fail "standard mode supports only one Valkey source: tracearr.redis.url, stateful valkey, redis alias, or valkey dependency" }}
  {{- end -}}
  {{- if eq $valkeySourceCount 0 -}}
{{ fail "standard mode requires tracearr.redis.url, tracearr.stateful.valkey.enabled, tracearr.stateful.redis.enabled, or tracearr.stateful.valkey.useDependency with valkey.enabled=true" }}
  {{- end -}}

  {{- if $legacyPostgresqlEnabled -}}
  {{- $postgresHost := printf "%s-postgresql" (include "common.fullname" .) -}}
  {{- $postgresUser := .Values.tracearr.stateful.postgresql.auth.username | default "tracearr" -}}
  {{- $postgresPassword := .Values.tracearr.stateful.postgresql.auth.password | default "tracearr" -}}
  {{- $postgresDatabase := .Values.tracearr.stateful.postgresql.auth.database | default "tracearr" -}}
  {{- $postgresPort := int (default .Values.tracearr.stateful.postgresql.port .Values.tracearr.stateful.postgresql.service.port) | default 5432 -}}
  {{- $databaseURL = printf "postgres://%s:%s@%s:%d/%s" (urlquery $postgresUser) (urlquery $postgresPassword) $postgresHost $postgresPort $postgresDatabase -}}
  {{- end -}}

  {{- if $cnpgEnabled -}}
  {{- $cnpgNamespace := default .Release.Namespace .Values.tracearr.stateful.cnpg.namespace -}}
  {{- $cnpgClusterName := default (printf "%s-cnpg" (include "common.fullname" .)) .Values.tracearr.stateful.cnpg.clusterName -}}
  {{- $cnpgPort := 5432 -}}
  {{- $cnpgDatabase := .Values.tracearr.stateful.cnpg.credentials.database | default "tracearr" -}}
  {{- $cnpgUser := .Values.tracearr.stateful.cnpg.credentials.username | default "tracearr" -}}
  {{- $cnpgPassword := .Values.tracearr.stateful.cnpg.credentials.password | default "tracearr" -}}
  {{- $databaseHost := printf "%s-rw.%s.svc.%s" $cnpgClusterName $cnpgNamespace .Values.tracearr.stateful.cnpg.clusterDomain -}}
  {{- $databaseURL = printf "postgres://%s:%s@%s:%d/%s" (urlquery $cnpgUser) (urlquery $cnpgPassword) $databaseHost $cnpgPort $cnpgDatabase -}}
  {{- end -}}

  {{- if $valkeyDependencyEnabled -}}
  {{- $valkeyDependencyHost := default (printf "%s-valkey" .Release.Name) .Values.tracearr.stateful.valkey.serviceName -}}
  {{- $dependencyValkeyPort := int (default .Values.tracearr.stateful.valkey.port .Values.valkey.service.port) | default 6379 -}}
  {{- $dependencyValkeyPassword := default "" .Values.tracearr.stateful.valkey.password -}}
  {{- if ne $dependencyValkeyPassword "" -}}
  {{- $redisURL = printf "redis://:%s@%s:%d/0" (urlquery $dependencyValkeyPassword) $valkeyDependencyHost $dependencyValkeyPort -}}
  {{- else -}}
  {{- $redisURL = printf "redis://%s:%d/0" $valkeyDependencyHost $dependencyValkeyPort -}}
  {{- end -}}
  {{- end -}}

  {{- if $legacyValkeyEnabled -}}
  {{- $legacyValkeyHost := printf "%s-valkey" (include "common.fullname" .) -}}
  {{- $legacyValkeyPort := int (default .Values.tracearr.stateful.valkey.port .Values.tracearr.stateful.valkey.service.port) | default 6379 -}}
  {{- $legacyValkeyPassword := .Values.tracearr.stateful.valkey.auth.password | default "" -}}
  {{- if ne $legacyValkeyPassword "" -}}
  {{- $redisURL = printf "redis://:%s@%s:%d/0" (urlquery $legacyValkeyPassword) $legacyValkeyHost $legacyValkeyPort -}}
  {{- else -}}
  {{- $redisURL = printf "redis://%s:%d/0" $legacyValkeyHost $legacyValkeyPort -}}
  {{- end -}}
  {{- end -}}

  {{- if $legacyRedisAliasEnabled -}}
  {{- $legacyRedisHost := printf "%s-valkey" (include "common.fullname" .) -}}
  {{- $legacyRedisPort := int (default .Values.tracearr.stateful.redis.port .Values.tracearr.stateful.redis.service.port) | default 6379 -}}
  {{- $legacyRedisPassword := .Values.tracearr.stateful.redis.auth.password | default "" -}}
  {{- if ne $legacyRedisPassword "" -}}
  {{- $redisURL = printf "redis://:%s@%s:%d/0" (urlquery $legacyRedisPassword) $legacyRedisHost $legacyRedisPort -}}
  {{- else -}}
  {{- $redisURL = printf "redis://%s:%d/0" $legacyRedisHost $legacyRedisPort -}}
  {{- end -}}
  {{- end -}}

  {{- if not (hasKey $tracearrEnv "DATABASE_URL") }}
  {{- $_ := set $tracearrEnv "DATABASE_URL" $databaseURL -}}
  {{- end -}}
  {{- if not (hasKey $tracearrEnv "REDIS_URL") }}
  {{- $_ := set $tracearrEnv "REDIS_URL" $redisURL -}}
  {{- end -}}
{{- end -}}

{{- $deploymentValues := deepCopy .Values -}}
{{- $_ := set $deploymentValues "image" (dict "repository" $imageRepository "pullPolicy" $imagePullPolicy "tag" $imageTag) -}}
{{- $_ := set $deploymentValues "container" (dict "env" $tracearrEnv "command" .Values.container.command "args" .Values.container.args) -}}

{{- $deploymentContext := dict
  "Values" $deploymentValues
  "Chart" .Chart
  "Release" .Release
  "Files" .Files
  "Capabilities" .Capabilities
  "Template" .Template
 }}

{{ include "common.deployment" $deploymentContext }}
---
{{ include "common.serviceAccount" . }}
---
{{ include "common.service" . }}
---
{{ include "common.ingress" . }}
---
{{ include "common.pvc" . }}
---
{{ include "common.hpa" . }}

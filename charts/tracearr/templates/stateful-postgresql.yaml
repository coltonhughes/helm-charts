{{- if .Values.tracearr.stateful.postgresql.enabled }}
{{- $fullname := include "common.fullname" . -}}
{{- $pvcEnabled := .Values.tracearr.stateful.postgresql.persistence.enabled -}}
{{- $claimName := .Values.tracearr.stateful.postgresql.persistence.claimName -}}
{{- $mountPath := .Values.tracearr.stateful.postgresql.persistence.mountPath -}}
{{- $servicePort := .Values.tracearr.stateful.postgresql.port | default .Values.tracearr.stateful.postgresql.service.port | default 5432 -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgresql
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "common.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ $servicePort }}
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgresql-headless
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "common.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ $servicePort }}
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgresql
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: {{ $fullname }}-postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.name" . }}-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.name" . }}-postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.tracearr.stateful.postgresql.image.repository }}:{{ .Values.tracearr.stateful.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.tracearr.stateful.postgresql.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ $servicePort }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.tracearr.stateful.postgresql.auth.database }}"
            - name: POSTGRES_USER
              value: "{{ .Values.tracearr.stateful.postgresql.auth.username }}"
            - name: POSTGRES_PASSWORD
              value: "{{ .Values.tracearr.stateful.postgresql.auth.password }}"
          resources:
            {{- toYaml .Values.tracearr.stateful.postgresql.resources | nindent 12 }}
          volumeMounts:
            {{- if $pvcEnabled }}
            - name: data
              mountPath: {{ $mountPath }}
              {{- with .Values.tracearr.stateful.postgresql.persistence.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
      {{- with .Values.tracearr.stateful.postgresql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tracearr.stateful.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tracearr.stateful.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $pvcEnabled $claimName }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $claimName }}
      {{- else if not $pvcEnabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if and $pvcEnabled (not $claimName) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.tracearr.stateful.postgresql.persistence.accessMode | quote }}
        {{- with .Values.tracearr.stateful.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.tracearr.stateful.postgresql.persistence.size | quote }}
  {{- end }}
---
{{- end }}

{{- $useValkey := default false .Values.tracearr.stateful.valkey.enabled -}}
{{- $useLegacyValkey := and (not $useValkey) (default false .Values.tracearr.stateful.redis.enabled) -}}
{{- if and (not (default false .Values.tracearr.stateful.valkey.useDependency)) (or $useValkey $useLegacyValkey) }}
{{- $fullname := include "common.fullname" . -}}
{{- $statefulValues := .Values.tracearr.stateful.valkey -}}
{{- if not $useValkey }}
{{- $statefulValues = .Values.tracearr.stateful.redis -}}
{{- end -}}
{{- $pvcEnabled := $statefulValues.persistence.enabled -}}
{{- $claimName := $statefulValues.persistence.claimName -}}
{{- $valkeyPassword := $statefulValues.auth.password -}}
{{- $servicePort := $statefulValues.port | default $statefulValues.service.port | default 6379 -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-valkey
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}-valkey
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "common.name" . }}-valkey
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: valkey
      port: {{ $servicePort }}
      targetPort: valkey
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-valkey
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}-valkey
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.name" . }}-valkey
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.name" . }}-valkey
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: valkey
          image: "{{ $statefulValues.image.repository }}:{{ $statefulValues.image.tag }}"
          imagePullPolicy: {{ $statefulValues.image.pullPolicy }}
          command: ["valkey-server"]
          args:
            - --save
            - "60"
            - "1"
            - --loglevel
            - warning
            {{- if ne (default "" $valkeyPassword) "" }}
            - --requirepass
            - {{ $valkeyPassword | quote }}
            {{- end }}
          ports:
            - name: valkey
              containerPort: {{ $servicePort }}
              protocol: TCP
          resources:
            {{- toYaml $statefulValues.resources | nindent 12 }}
          volumeMounts:
            {{- if $pvcEnabled }}
            - name: data
              mountPath: {{ $statefulValues.persistence.mountPath }}
              {{- with $statefulValues.persistence.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
      {{- with $statefulValues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $statefulValues.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $statefulValues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $pvcEnabled $claimName }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $claimName }}
      {{- else if $pvcEnabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullname }}-valkey-data
      {{- else if not $pvcEnabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
{{- if and $pvcEnabled (not $claimName) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-valkey-data
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}-valkey
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - {{ $statefulValues.persistence.accessMode | quote }}
  {{- with $statefulValues.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $statefulValues.persistence.size | quote }}
{{- end }}
{{- end }}

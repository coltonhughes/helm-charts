# Default values for tracearr.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
deploymentStrategy:
  type: Recreate

image:
  repository: ghcr.io/connorgallopo/tracearr
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

container:
  env:
    TZ: America/Chicago
    LOG_LEVEL: "info"
  command: []
  args: []

containerPorts:
  - name: http
    containerPort: 3000
    protocol: TCP

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3000
  protocol: TCP
  targetPort: http
  loadBalancerIP: ""
  ipFamilyPolicy: ""
  ipFamilies: []
  annotations: {}
  ports: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tracearr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
  hostnames: []
  rules: []

resources: {}

livenessProbe: {}
readinessProbe: {}

initContainers: []
initContainersTemplate: ""
extraContainers: []
extraContainersTemplate: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

gpu:
  enabled: false
  type: ""
  runtimeClassName: ""
  resources: {}

persistence:
  enabled: true
  storageClass: ""
  existingClaim: ""
  claimName: ""
  accessMode: ReadWriteOnce
  size: 2Gi
  mountPath: /config
  subPath: ""
  name: data

valkey:
  # Default values passed through to the valkey dependency chart.
  enabled: false
  global:
    image:
      repository: docker.io/valkey/valkey
      tag: "8"
      pullPolicy: IfNotPresent
  auth:
    enabled: false
    password: ""
  dataStorage:
    enabled: true
    size: 4Gi
  resources:
    requests: {}
    limits: {}
  service:
    type: ClusterIP
    port: 6379
    annotations: {}
    labels: {}
  readinessProbe:
    enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

tracearr:
  # Global image override for Tracearr application in any mode.
  # Mode-specific values under `tracearr.modes.*.image` take precedence.
  image:
    repository: ""
    pullPolicy: ""
    tag: ""

  # Deployment mode controls how this chart sets up the application.
  # - standard: external PostgreSQL + Valkey-compatible cache and tracearr app container.
  # - supervised: dedicated tracearr supervised container image with embedded services.
  mode: "standard"

  claimCode: ""
  sessionSecret: ""

  database:
    # Required when mode=standard unless CNPG is managed by this chart.
    url: "postgres://tracearr:tracearr@postgres:5432/tracearr"

  redis:
    # Required when mode=standard unless Valkey dependency is managed by this chart.
    url: "redis://redis:6379/0"

  modes:
    standard:
      image:
        repository: ghcr.io/connorgallopo/tracearr
        pullPolicy: Always
        tag: "latest"
    supervised:
      image:
        repository: ghcr.io/connorgallopo/tracearr
        pullPolicy: Always
        tag: "supervised"

  stateful:
    cnpg:
      enabled: false
      clusterName: ""
      namespace: ""
      clusterDomain: "cluster.local"
      createCredentialsSecret: true
      credentials:
        secretName: ""
        username: tracearr
        password: tracearr
        database: tracearr
      instances: 1
      storage:
        size: 8Gi
        storageClass: ""

      # Optional overrides merged with chart defaults.
      affinity: {}
      tolerations: []
      nodeSelector: {}
      resources: {}
      backup:
        enabled: false
        retentionPolicy: 7d

  container:
    env: {}

# Default values for seerr.

replicaCount: 1

workload:
  kind: StatefulSet
  serviceName: ""
  updateStrategy: {}

deploymentStrategy: {}

image:
  repository: ghcr.io/seerr-team/seerr
  pullPolicy: IfNotPresent
  tag: "v3.0.1"

container:
  env: {}
  command: []
  args: []

containerPorts:
  - name: http
    containerPort: 5055
    protocol: TCP

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: false
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  # Prebuilt chart exposes port 80 -> container port 5055.
  port: 80
  protocol: TCP
  targetPort: http
  loadBalancerIP: ""
  ipFamilyPolicy: PreferDualStack
  ipFamilies: []
  annotations: {}
  ports: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: seerr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
  hostnames: []
  rules: []

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

initContainers: []
initContainersTemplate: ""
extraContainers: []
extraContainersTemplate: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

gpu:
  enabled: false
  type: ""
  runtimeClassName: ""
  resources: {}

persistence:
  enabled: true
  storageClass: ""
  existingClaim: ""
  claimName: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /app/config
  subPath: ""
  name: config

nodeSelector: {}
tolerations: []
affinity: {}

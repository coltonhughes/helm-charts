---
# Source: seerr-chart/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-seerr-chart
  labels:
    helm.sh/chart: seerr-chart-3.1.0
    app.kubernetes.io/name: seerr-chart
    app.kubernetes.io/instance: my-seerr-chart
    app.kubernetes.io/version: "v3.0.1"
    app.kubernetes.io/part-of: seerr-chart
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: my-seerr-chart
  selector:
    matchLabels:
      app.kubernetes.io/name: seerr-chart
      app.kubernetes.io/instance: my-seerr-chart
  template:
    metadata:
      labels:
        helm.sh/chart: seerr-chart-3.1.0
        app.kubernetes.io/name: seerr-chart
        app.kubernetes.io/instance: my-seerr-chart
        app.kubernetes.io/version: "v3.0.1"
        app.kubernetes.io/part-of: seerr-chart
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: my-seerr-chart
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: seerr-chart
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          image: "ghcr.io/seerr-team/seerr:v3.0.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5055
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {}
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: my-seerr-chart-config
---
# Source: seerr-chart/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "my-seerr-chart-test-connection"
  labels:
    helm.sh/chart: seerr-chart-3.1.0
    app.kubernetes.io/name: seerr-chart
    app.kubernetes.io/instance: my-seerr-chart
    app.kubernetes.io/version: "v3.0.1"
    app.kubernetes.io/part-of: seerr-chart
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['my-seerr-chart:80']
  restartPolicy: Never
